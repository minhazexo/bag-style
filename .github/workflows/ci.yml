name: Build and typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        run: bun install

      - name: Preserve Bun lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bun-lockfile
          path: bun.lock
          if-no-files-found: error

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build
